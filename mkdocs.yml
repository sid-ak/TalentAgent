site_name: TalentAgent
site_description: >-
  An event-driven multi-agent system that operates a job search as a long-running workflow —
  evidence-constrained generation, derived pipeline state, and a closed experiment loop.
site_url: https://sid-ak.github.io/TalentAgent/
site_author: Sidharth Anandkumar

repo_url: https://github.com/sid-ak/TalentAgent
repo_name: sid-ak/TalentAgent
edit_uri: edit/main/docs/

copyright: Documentation for TalentAgent

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# `mkdocs serve` watches docs/ and mkdocs.yml by default. The code reference is generated from the
# source, so without these a module edited during a preview would not reload.
watch:
  - talentagent
  - scripts/gen_ref_pages.py

nav:
  - Home: index.md
  - Why: TalentAgent-Why.md
  - Specification: TalentAgent-Spec.md
  - Architecture: TalentAgent-Architecture.md
  - Plan: TalentAgent-Plan.md
  - Explanations:
      - explanations/index.md
      - Phase 0 - foundations: explanations/phase-0-foundations.md
      - Phase 1 - two-pass apply: explanations/phase-1-two-pass-apply.md
  - Phase gates:
      - Spike A - two-pass apply: gates/spike-a.md
  - Code reference: reference/
  - Decision records:
      - ADRs/README.md
      - ADRs/0001-human-retains-irreversible-actions.md
      - ADRs/0002-graded-attestation-classes.md
      - ADRs/0003-eligibility-gates-priors-rank.md
      - ADRs/0004-exploration-budget.md
      - ADRs/0005-derived-pipeline-state.md
      - ADRs/0006-two-tier-model-routing.md
      - ADRs/0007-coordination-through-state.md
      - ADRs/0008-deterministic-field-map.md
      - ADRs/0009-findings-expire.md
      - ADRs/0010-platform-scope.md
      - ADRs/0011-three-pillar-scope.md
      - ADRs/0012-zero-budget-constraint.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # The code reference is generated from the source on every build, so a module added in a later
  # phase appears without anyone editing the nav. See scripts/gen_ref_pages.py.
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Read statically from the repository rather than from an installed package, so the docs
          # build does not need the runtime dependencies.
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            # __init__ docstrings are merged into their class, so a dataclass reads as one
            # entry rather than two.
            merge_init_into_class: true
            # No filter. This is an internal reference, so how a component works is as much the
            # point as what it exposes: private helpers stay, and so do the operator methods that
            # are genuinely part of a contract here — Completion supports +, Registry supports
            # len() and iteration. Griffe reads the source, so dataclass-generated methods that
            # were never written down do not appear.
            filters: []
            # Enum members and constants carry their meaning in an attribute docstring; those
            # without one are still worth listing, since the value itself is the documentation.
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: info

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sid-ak/TalentAgent
      name: TalentAgent on GitHub
