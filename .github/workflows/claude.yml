name: Claude Code

# Responds when someone mentions @claude in an issue, a pull request review, or a comment on
# either. Unlike claude-code-review.yml this is invoked deliberately by a person, so it carries
# no prompt of its own: the instruction is whatever the comment said.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repository secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Lets Claude read the CI results on a pull request, so a question about a failing
          # check can be answered from the run rather than guessed at.
          additional_permissions: |
            actions: read

          # No prompt: the comment that summoned it is the instruction. AGENTS.md carries the
          # working agreement, and the phase epics carry what is in flight.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
