name: docs

# Builds the MkDocs site on every change that can affect it, and publishes it to GitHub Pages from
# the default branch. Pull requests build strictly but never deploy, so a broken internal link fails
# review rather than the live site.
#
# The site includes a code reference generated from the source on every build, so a module added in
# a later phase documents itself. That is why a change under talentagent/ triggers this workflow.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # The code reference is generated from the source, so a code change changes the site.
      - "talentagent/**"
      - "scripts/gen_ref_pages.py"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # The code reference is generated from the source, so a code change changes the site.
      - "talentagent/**"
      - "scripts/gen_ref_pages.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the documentation toolchain
        run: pip install -r requirements-docs.txt

      - name: Build strictly
        # Silences an unrelated ecosystem advisory a plugin prints, so a real warning stays visible.
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict --site-dir site

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
