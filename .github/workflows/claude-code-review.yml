name: Claude Code Review

# Reviews every pull request automatically and posts its findings as inline comments.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repository secret. Without it the job fails at the action
# step rather than silently passing, which is the right way round.

on:
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The skill's step 1 stops when Claude has already commented on the pull request. That is
          # written into the plugin's command file rather than exposed as a flag, so it is
          # overridden here in the prompt. The other preconditions it checks — closed, draft,
          # nothing worth reviewing — are left alone: only the repeat-comment rule was unwanted,
          # since a push to a reviewed branch should get a fresh review rather than silence.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Override one precondition in step 1: review this pull request even when Claude has
            already commented on it. Post the review regardless of any earlier Claude comment.
            Keep every other precondition — still stop for a closed or draft pull request, or
            one that genuinely needs no review.

            Read AGENTS.md before reviewing. It is the working agreement, and most of what makes
            a change wrong in this repository is specific to it rather than general. Weight these
            especially, and cite the invariant by name when one is at stake:

            - The guardrails G1 to G7 are enforced in the policy layer and asserted in tests, never
              in prompt text. A change that moves an invariant into a prompt, or that makes a
              `human-only` tool reachable from an agent, is a defect however well it reads.
            - Exactly one agent writes each field, and agents never call one another — all
              coordination is through durable state (Spec 2.2, ADR-0007). A direct call between
              agents is a defect.
            - Deterministic first, model last (ADR-0008). Thread attribution, ATS field resolution,
              and posting parsing are lookups. A model call that could have been one costs both
              reliability and free-tier quota.
            - Every event-driven write is idempotent and keyed on `evidence_message_id`; handlers
              must assume re-runs (Spec 8.6).
            - Application state is derived from the inbox, never entered. A code path or UI control
              that lets a user type a pipeline state is a defect (ADR-0005).
            - No dependency may require a payment instrument, and the test suite must make zero
              model API calls — recorded golden responses are the quota control (ADR-0012).
            - Docstrings on every module, class, function, fixture, and test. Module constants and
              enum members take a docstring after the assignment, never a `#:` comment, which is
              invisible to the generated reference.
            - Markdown in this repository uses no bold. Documents separate what a thing does from
              why it was chosen from how it works, and state each fact once.

            Flag duplicated logic rather than letting it stand: a block that has appeared a second
            time is a defect here, not a nitpick.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Defaults to false. On means a review that decides to say nothing still leaves its
          # reasoning in the run summary, instead of a green check that explains nothing.
          #
          # show_full_output is deliberately left off. It would add every message including tool
          # results, and this repository is public, so that log is world-readable — GitHub masks
          # the secret values it knows, and nothing else. The report alone gives the visibility;
          # the full stream is a debugging tool worth turning on deliberately and briefly, not
          # leaving on.
          display_report: "true"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
