<!doctype html>
<!-- Lever standard application form. Lever uses flat field names and urls[Network] for profiles. -->
<html lang="en"><head><meta charset="utf-8"><title>Backend Engineer - Apply</title></head>
<body>
<div class="application-page">
  <form class="application-form" action="/apply" method="post">
    <label class="application-label" for="lever-name">Full name<span class="required">✱</span></label>
    <input id="lever-name" type="text" name="name" required>

    <label class="application-label" for="lever-email">Email<span class="required">✱</span></label>
    <input id="lever-email" type="email" name="email" required>

    <label class="application-label" for="lever-phone">Phone</label>
    <input id="lever-phone" type="tel" name="phone">

    <label class="application-label" for="lever-org">Current company</label>
    <input id="lever-org" type="text" name="org">

    <label class="application-label" for="lever-linkedin">LinkedIn URL</label>
    <input id="lever-linkedin" type="url" name="urls[LinkedIn]">

    <label class="application-label" for="lever-github">GitHub URL</label>
    <input id="lever-github" type="url" name="urls[GitHub]">

    <button type="submit" class="postings-btn" id="btn-submit">Submit application</button>
  </form>
</div>
</body></html>
