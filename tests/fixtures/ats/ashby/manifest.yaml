# See greenhouse/manifest.yaml for what the fields mean. Ashby names custom questions by UUID, and
# labels several built-in fields with aria-label rather than a <label for>, which is what the
# resolver's ARIA strategy exists for.
platform: ashby
fixtures:
  plain.html:
    fields:
      - {name: "_systemfield_name", path: identity.full_name}
      - {name: "_systemfield_email", path: identity.email}
      - {name: "_systemfield_phone", path: identity.phone}
      - {name: "_systemfield_location", path: identity.location}
      - {name: "_systemfield_linkedin", path: links.linkedin}
      - {name: "_systemfield_github", path: links.github}
  file-upload.html:
    fields:
      - {name: "_systemfield_name", path: identity.full_name}
      - {name: "_systemfield_email", path: identity.email}
      - {name: "_systemfield_resume", path: materials.resume}
      - {name: "_systemfield_coverletter", path: materials.cover_letter}
  custom-questions.html:
    fields:
      - {name: "_systemfield_name", path: identity.full_name}
      - {name: "_systemfield_email", path: identity.email}
      - {name: "_systemfield_resume", path: materials.resume}
      - {name: "4a1c9e7b-2d3f-4e51-9a0b-6c7d8e9f0a1b", unmapped: true}
      - {name: "5b2d0f8c-3e4a-4f62-8b1c-7d8e9f0a1b2c", unmapped: true}
      - {name: "6c3e1a9d-4f5b-4073-9c2d-8e9f0a1b2c3d", unmapped: true}
  conditional.html:
    fields:
      - {name: "_systemfield_name", path: identity.full_name}
      - {name: "_systemfield_email", path: identity.email}
      - {name: "7d4f2b0e-5a6c-4184-8d3e-9f0a1b2c3d4e", unmapped: true}
      - {name: "8e5a3c1f-6b7d-4295-9e4f-0a1b2c3d4e5f", unmapped: true, conditional: true}
