<!doctype html>
<!-- Greenhouse form with employer-authored screening questions. These carry answers_attributes
     indices rather than stable names, which is exactly the case the field map cannot cover in
     advance and must report as unmapped (ADR-0008). -->
<html lang="en"><head><meta charset="utf-8"><title>Apply - Senior Backend Engineer</title></head>
<body>
<main id="application_form">
  <form id="application-form" action="/applications" method="post">
    <label for="first_name">First Name <span class="required">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" required>

    <label for="last_name">Last Name <span class="required">*</span></label>
    <input type="text" id="last_name" name="job_application[last_name]" required>

    <label for="email">Email <span class="required">*</span></label>
    <input type="email" id="email" name="job_application[email]" required>

    <label for="resume">Resume/CV <span class="required">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" required>

    <label for="q_0">How many years of production Python experience do you have?</label>
    <input type="text" id="q_0" name="job_application[answers_attributes][0][text_value]">

    <label for="q_1">Are you legally authorised to work in the United States?</label>
    <select id="q_1" name="job_application[answers_attributes][1][boolean_value]">
      <option value=""></option><option value="1">Yes</option><option value="0">No</option>
    </select>

    <label for="q_2">Will you now or in the future require visa sponsorship?</label>
    <select id="q_2" name="job_application[answers_attributes][2][boolean_value]">
      <option value=""></option><option value="1">Yes</option><option value="0">No</option>
    </select>

    <label for="q_3">Describe a system you designed that had to survive a tenfold traffic increase.</label>
    <textarea id="q_3" name="job_application[answers_attributes][3][text_value]"></textarea>

    <button type="submit" id="submit_app" name="commit">Submit Application</button>
  </form>
</main>
</body></html>
