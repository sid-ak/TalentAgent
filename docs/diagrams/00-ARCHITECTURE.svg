<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" role="img" aria-label="TalentAgent architecture">
  <style>
    text { font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h1   { font-size: 26px; font-weight: 600; fill: #202124; }
    .h2   { font-size: 13.5px; fill: #5f6368; }
    .ct   { font-size: 15px; font-weight: 500; fill: #202124; }
    .cs   { font-size: 11.5px; fill: #5f6368; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
    .grp  { font-size: 12px; font-weight: 600; fill: #3c4043; letter-spacing: .06em; }
    .nm   { font-size: 14.5px; font-weight: 500; fill: #202124; }
    .sub  { font-size: 11px; fill: #5f6368; font-family: "Roboto Mono", ui-monospace, Menlo, monospace; }
    .lb   { font-size: 11.5px; fill: #3c4043; }
    .note { font-size: 12px; fill: #5f6368; }
    .card { fill: #ffffff; stroke: #202124; stroke-width: 1.4; }
    .flow { stroke: #202124; stroke-width: 1.6; fill: none; }
    .ctrl { stroke: #202124; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
    .hum  { stroke: #188038; stroke-width: 1.9; fill: none; }
    .ic   { fill: none; stroke: #1a73e8; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icg  { fill: none; stroke: #188038; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#188038"/>
    </marker>

    <g id="i-mail"><rect class="ic" x="2" y="5" width="20" height="14" rx="2"/><path class="ic" d="M2.5 6.5 L12 13.5 L21.5 6.5"/></g>
    <g id="i-cal"><rect class="ic" x="3" y="5" width="18" height="16" rx="2"/><path class="ic" d="M3 10h18M8 3v4M16 3v4"/></g>
    <g id="i-code"><path class="ic" d="M8.5 7.5 L3.5 12 L8.5 16.5M15.5 7.5 L20.5 12 L15.5 16.5"/></g>
    <g id="i-ats"><rect class="ic" x="3" y="7" width="18" height="13" rx="2"/><path class="ic" d="M9 7V5h6v2M3 12h18"/></g>
    <g id="i-doc"><path class="ic" d="M6 3h8l4 4v14H6z"/><path class="ic" d="M14 3v4h4M9 13h6M9 17h6"/></g>
    <g id="i-bolt"><path class="ic" d="M13 3 L6 13h5l-1 8 7-10h-5z"/></g>
    <g id="i-filter"><path class="ic" d="M3 5h18l-7 8v7l-4-2v-5z"/></g>
    <g id="i-flow"><circle class="ic" cx="6" cy="6" r="2.6"/><circle class="ic" cx="18" cy="12" r="2.6"/><circle class="ic" cx="6" cy="18" r="2.6"/><path class="ic" d="M8.6 6H13a2.5 2.5 0 0 1 2.5 3M8.6 18H13a2.5 2.5 0 0 0 2.5-3"/></g>
    <g id="i-ai"><path class="ic" d="M12 3 L14 9.5 L20.5 12 L14 14.5 L12 21 L10 14.5 L3.5 12 L10 9.5 Z"/></g>
    <g id="i-db"><ellipse class="ic" cx="12" cy="6" rx="8" ry="3"/><path class="ic" d="M4 6v12c0 1.6 3.6 3 8 3s8-1.4 8-3V6M4 12c0 1.6 3.6 3 8 3s8-1.4 8-3"/></g>
    <g id="i-web"><circle class="ic" cx="12" cy="12" r="9"/><path class="ic" d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></g>
    <g id="i-key"><circle class="ic" cx="8" cy="12" r="4"/><path class="ic" d="M12 12h9M18 12v4M15 12v3"/></g>
    <g id="i-form"><rect class="ic" x="3" y="4" width="18" height="16" rx="2"/><path class="ic" d="M3 9h18M7 13h7M7 16h5"/></g>
    <g id="i-sync"><path class="ic" d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path class="ic" d="M17 3v4h-4M7 21v-4h4"/></g>
    <g id="i-chart"><path class="ic" d="M4 20V4M4 20h16"/><path class="ic" d="M8 17v-5M13 17V8M18 17v-8"/></g>
    <g id="i-user"><circle class="icg" cx="12" cy="8" r="3.6"/><path class="icg" d="M5 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/></g>
    <g id="i-send"><path class="icg" d="M21 3 L10.5 13.5M21 3 L14.5 21 L10.5 13.5 L3 9.5 Z"/></g>
  </defs>

  <rect x="0" y="0" width="1400" height="1010" fill="#ffffff"/>

  <text class="h1" x="32" y="42">TalentAgent — Architecture</text>
  <text class="h2" x="32" y="64">Event-driven agents over a single shared store. Autonomy on preparation; the human owns the send.</text>

  <!-- ============ EXTERNAL ============ -->
  <rect x="24" y="76" width="1352" height="124" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
  <text class="grp" x="44" y="102">EXTERNAL SYSTEMS</text>

  <g><rect class="card" x="64" y="118" width="232" height="60" rx="8"/><use href="#i-mail" x="82" y="136"/><text class="nm" x="118" y="146">Gmail</text><text class="sub" x="118" y="163">inbox + threads</text></g>
  <g><rect class="card" x="324" y="118" width="232" height="60" rx="8"/><use href="#i-cal" x="342" y="136"/><text class="nm" x="378" y="146">Google Calendar</text><text class="sub" x="378" y="163">tentative holds</text></g>
  <g><rect class="card" x="584" y="118" width="232" height="60" rx="8"/><use href="#i-code" x="602" y="136"/><text class="nm" x="638" y="146">GitHub API</text><text class="sub" x="638" y="163">commits · PRs</text></g>
  <g><rect class="card" x="844" y="118" width="232" height="60" rx="8"/><use href="#i-ats" x="862" y="136"/><text class="nm" x="898" y="146">ATS platforms</text><text class="sub" x="898" y="163">Greenhouse · Lever · Ashby</text></g>
  <g><rect class="card" x="1104" y="118" width="232" height="60" rx="8"/><use href="#i-doc" x="1122" y="136"/><text class="nm" x="1158" y="146">Public filings</text><text class="sub" x="1158" y="163">sponsorship data</text></g>

  <!-- ============ GOOGLE ============ -->
  <rect x="24" y="236" width="700" height="680" rx="14" fill="#d2e3fc"/>
  <text class="ct" x="374" y="264" text-anchor="middle">Google</text>
  <text class="cs" x="374" y="282" text-anchor="middle">Apps Script · Firebase · Gemini</text>

  <!-- Apps Script -->
  <rect x="48" y="296" width="652" height="154" rx="10" fill="#fde293"/>
  <text class="grp" x="68" y="320">APPS SCRIPT</text>
  <g><rect class="card" x="72" y="336" width="190" height="64" rx="8"/><use href="#i-bolt" x="88" y="356"/><text class="nm" x="120" y="362">trigger</text><text class="sub" x="120" y="378">hourly · weekdays</text><text class="sub" x="120" y="392">6-hourly otherwise</text></g>
  <g><rect class="card" x="286" y="336" width="190" height="64" rx="8"/><use href="#i-filter" x="302" y="356"/><text class="nm" x="334" y="366">triage</text><text class="sub" x="334" y="383">tier 1</text></g>
  <g><rect class="card" x="500" y="336" width="190" height="64" rx="8"/><use href="#i-flow" x="516" y="356"/><text class="nm" x="548" y="366">pipeline</text><text class="sub" x="548" y="383">tier 2</text></g>

  <!-- Gemini -->
  <g><rect class="card" x="386" y="478" width="314" height="72" rx="8"/><use href="#i-ai" x="406" y="502"/><text class="nm" x="442" y="512">Gemini API</text><text class="sub" x="442" y="529">Flash · Flash-Lite</text></g>

  <!-- Firebase -->
  <rect x="48" y="576" width="652" height="316" rx="10" fill="#fde293"/>
  <text class="grp" x="68" y="600">FIREBASE</text>
  <g><rect class="card" x="72" y="616" width="290" height="248" rx="8"/><use href="#i-db" x="92" y="638"/><text class="nm" x="128" y="656">Firestore</text>
    <text class="sub" x="92" y="690">applications</text>
    <text class="sub" x="92" y="710">evidence_graph</text>
    <text class="sub" x="92" y="730">packages</text>
    <text class="sub" x="92" y="750">hypotheses</text>
    <text class="sub" x="92" y="770">assignment_rules</text>
    <line x1="92" y1="788" x2="342" y2="788" stroke="#dadce0"/>
    <text class="sub" x="92" y="810">outcomes</text>
    <text class="lb" x="92" y="830">append-only by rule</text>
  </g>
  <g><rect class="card" x="386" y="616" width="290" height="60" rx="8"/><use href="#i-web" x="406" y="634"/><text class="nm" x="442" y="644">Hosting</text><text class="sub" x="442" y="661">review UI · static</text></g>
  <g><rect class="card" x="386" y="700" width="290" height="60" rx="8"/><use href="#i-key" x="406" y="718"/><text class="nm" x="442" y="728">Auth</text><text class="sub" x="442" y="745">single user</text></g>

  <!-- ============ GITHUB ACTIONS ============ -->
  <rect x="760" y="236" width="340" height="304" rx="14" fill="#e8eaed"/>
  <text class="ct" x="930" y="264" text-anchor="middle">GitHub Actions</text>
  <text class="cs" x="930" y="282" text-anchor="middle">public repo</text>
  <g><rect class="card" x="784" y="290" width="292" height="64" rx="8"/><use href="#i-form" x="804" y="310"/><text class="nm" x="840" y="320">form-worker</text><text class="sub" x="840" y="337">dispatch · Chromium</text></g>
  <g><rect class="card" x="784" y="368" width="292" height="64" rx="8"/><use href="#i-sync" x="804" y="388"/><text class="nm" x="840" y="398">evidence-sync</text><text class="sub" x="840" y="415">cron</text></g>
  <g><rect class="card" x="784" y="446" width="292" height="64" rx="8"/><use href="#i-chart" x="804" y="466"/><text class="nm" x="840" y="476">analyst</text><text class="sub" x="840" y="493">cron</text></g>

  <!-- ============ HUMAN ============ -->
  <rect x="760" y="620" width="340" height="200" rx="14" fill="#e6f4ea"/>
  <text class="ct" x="930" y="650" text-anchor="middle">Human</text>
  <g><rect class="card" x="784" y="672" width="292" height="64" rx="8"/><use href="#i-user" x="804" y="692"/><text class="nm" x="840" y="702">review</text><text class="sub" x="840" y="719">credits · gaps</text></g>
  <g><rect class="card" x="784" y="752" width="292" height="64" rx="8"/><use href="#i-send" x="804" y="772"/><text class="nm" x="840" y="782">submit</text><text class="sub" x="840" y="799">the only irreversible act</text></g>

  <!-- ============ EDGES ============ -->
  <path class="ctrl" marker-end="url(#a)" d="M180 178 V 330"/>
  <text class="lb" x="190" y="250">scheduled poll</text>

  <path class="flow" marker-end="url(#a)" d="M262 368 H 280"/>
  <path class="flow" marker-end="url(#a)" d="M476 368 H 494"/>

  <path class="flow" marker-end="url(#a)" d="M381 400 V 430 H 543 V 472"/>
  <path class="flow" marker-end="url(#a)" d="M595 400 V 452 H 217 V 610"/>

  <path class="flow" marker-end="url(#a)" d="M784 322 H 736 V 514 H 706"/>

  <path class="flow" marker-start="url(#a)" marker-end="url(#a)" d="M362 690 H 730 V 400 H 778"/>

  <path class="ctrl" marker-end="url(#a)" d="M676 640 H 712 V 322 H 778"/>

  <path class="flow" marker-end="url(#a)" d="M676 662 H 745 V 704 H 778"/>

  <path class="flow" marker-end="url(#a)" d="M930 736 V 746"/>

  <path class="flow" marker-end="url(#a)" d="M696 178 V 216 H 1140 V 400 H 1082"/>
  <path class="flow" marker-end="url(#a)" d="M1010 178 V 284"/>
  <path class="flow" marker-end="url(#a)" d="M1220 178 V 478 H 1082"/>

  <path class="hum" marker-end="url(#ag)" d="M1076 784 H 1112 V 196 H 880 V 184"/>

  <!-- ============ LEGEND ============ -->
  <rect x="24" y="936" width="620" height="56" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <path class="flow" marker-end="url(#a)" d="M48 964 H 96"/>
  <text class="lb" x="106" y="968">data flow</text>
  <path class="ctrl" marker-end="url(#a)" d="M196 964 H 244"/>
  <text class="lb" x="254" y="968">trigger / control</text>
  <path class="hum" marker-end="url(#ag)" d="M380 964 H 428"/>
  <text class="lb" x="438" y="968">human action — never automated</text>
</svg>
